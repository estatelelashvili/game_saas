<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Config-Driven Game Client</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap");
      body {
        font-family: "Inter", sans-serif;
        background-color: #f3f4f6;
        min-height: 100vh;
      }
      .game-container {
        min-height: 400px;
        border-radius: 1rem;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1),
          0 10px 10px -5px rgba(0, 0, 0, 0.04);
        transition: all 0.5s ease-in-out;
      }
    </style>
  </head>
  <body class="p-4 sm:p-8 flex items-center justify-center">
    <div
      class="game-container w-full max-w-lg bg-white p-6 sm:p-8 space-y-6 text-center"
    >
      <h1 id="gameTitle" class="text-4xl font-extrabold text-indigo-600">
        Loading Game...
      </h1>
      <p id="statusMessage" class="text-gray-500 text-sm">
        Waiting for configuration data from Firestore...
      </p>

      <!-- Dynamic Game Rendering Area -->
      <div id="gameArea" class="border-t pt-6">
        <p class="text-gray-400">
          Game content will appear here once configured.
        </p>
      </div>

      <p class="text-xs text-gray-400 mt-4">
        Configuration ID: <span id="configIdDisplay">N/A</span>
      </p>
    </div>

    <!-- Firebase Imports and Script -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
      import {
        getAuth,
        signInAnonymously,
        signInWithCustomToken,
      } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
      import {
        getFirestore,
        doc,
        getDoc,
        collection,
        setLogLevel,
      } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

      // IMPORTANT: Global variables are provided by the Canvas environment

      const firebaseConfig = {
        apiKey: "AIzaSyBswmEuKEW2iZE1HINqoOd41eVbtKT6tI4",
        authDomain: "gameconfigdashboard.firebaseapp.com",
        projectId: "gameconfigdashboard",
        storageBucket: "gameconfigdashboard.firebasestorage.app",
        messagingSenderId: "704597526858",
        appId: "1:704597526858:web:219e314baa38298ffe99b3",
        measurementId: "G-04M7FKLR5M",
      };

      const appId = firebaseConfig.appId;
      const initialAuthToken = null;

      let app;
      let db;
      let auth;
      let currentUserId = null;
      let isAuthReady = false;

      setLogLevel("debug"); // Enable Firestore logging

      const gameArea = document.getElementById("gameArea");
      const gameTitle = document.getElementById("gameTitle");
      const statusMessage = document.getElementById("statusMessage");
      const configIdDisplay = document.getElementById("configIdDisplay");

      // --- Core Firebase Initialization ---
      async function initializeFirebase() {
        try {
          if (Object.keys(firebaseConfig).length === 0) {
            statusMessage.textContent = "Error: Firebase config not available.";
            return;
          }

          app = initializeApp(firebaseConfig);
          db = getFirestore(app);
          auth = getAuth(app);

          // Sign in to access public data
          if (initialAuthToken) {
            await signInWithCustomToken(auth, initialAuthToken);
          } else {
            await signInAnonymously(auth);
          }

          isAuthReady = true;
          await loadGameConfiguration();
        } catch (error) {
          console.error("Firebase Initialization Error:", error);
          statusMessage.textContent = `Error initializing Firebase: ${error.message}`;
        }
      }

      // --- Utility to get configId from URL ---
      function getConfigId() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get("configId");
      }

      // --- Core Data Fetching Logic ---
      async function loadGameConfiguration() {
        if (!isAuthReady) return;

        const configId = getConfigId();
        if (!configId) {
          gameTitle.textContent = "Error: Missing ID";
          statusMessage.textContent =
            "URL is missing the required '?configId=' parameter. Game cannot load.";
          return;
        }

        configIdDisplay.textContent = configId;
        statusMessage.textContent = `Fetching configuration for ID: ${configId}...`;

        // Public path: /artifacts/{appId}/public/data/game_configs/{configId} (must match Dashboard save path)
        const configPath = `artifacts/${appId}/public/data/game_configs`;
        const configDocRef = doc(collection(db, configPath), configId);

        try {
          const docSnap = await getDoc(configDocRef);

          if (docSnap.exists()) {
            const config = docSnap.data();
            console.log("Configuration Loaded:", config);
            renderGame(config); // The main decoupled step!
          } else {
            gameTitle.textContent = "Error: Config Not Found";
            statusMessage.textContent = `No game configuration found for ID: ${configId}.`;
          }
        } catch (e) {
          console.error("Error fetching document: ", e);
          gameTitle.textContent = "Error: Network Issue";
          statusMessage.textContent = `Could not fetch game configuration. Check console for details.`;
        }
      }

      // --- The Decoupled Rendering Engine ---

      function renderGame(config) {
        gameTitle.textContent = config.title || "Untitled Game";
        statusMessage.textContent = `Running Game Type: ${config.gameType}`;
        gameArea.className = "border-t pt-6 bg-gray-100 p-4 rounded-b-lg"; // Style update to show game start

        // Clear previous game content
        gameArea.innerHTML = "";

        // This is where the game engine selects the right template/logic
        if (config.gameType === "clicker") {
          renderClicker(config.data);
        } else if (config.gameType === "quiz") {
          renderQuiz(config.data);
        } else if (config.gameType === "memory") {
          renderMemory(config.data);
        } else {
          gameArea.innerHTML = `<p class="text-red-500">Unknown game type: ${config.gameType}</p>`;
        }
      }

      // --- 1. Clicker Game Logic (Dynamically configured) ---
      function renderClicker(data) {
        let score = 0;
        const target = data.targetScore || 10;
        let timeRemaining = data.durationSeconds || 10;
        let gameRunning = true;
        let timerInterval;

        const html = `
                <div class="space-y-4">
                    <p class="text-2xl font-bold">Score: <span id="clickerScore" class="text-indigo-600">${score}</span> / ${target}</p>
                    <p class="text-lg">Time Left: <span id="clickerTimer" class="font-semibold">${timeRemaining}s</span></p>
                    <button id="clickerBtn" class="bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-4 px-8 rounded-xl transition duration-150 transform hover:scale-105 active:scale-95 text-xl shadow-lg">
                        ${data.buttonText || "Click Me!"}
                    </button>
                    <p id="clickerMessage" class="text-green-700 font-semibold mt-2 hidden"></p>
                </div>
            `;
        gameArea.innerHTML = html;

        const scoreDisplay = document.getElementById("clickerScore");
        const timerDisplay = document.getElementById("clickerTimer");
        const clickerBtn = document.getElementById("clickerBtn");
        const messageDisplay = document.getElementById("clickerMessage");

        function updateTimer() {
          timeRemaining--;
          timerDisplay.textContent = `${timeRemaining}s`;

          if (timeRemaining <= 0 || score >= target) {
            clearInterval(timerInterval);
            gameRunning = false;
            clickerBtn.disabled = true;
            if (score >= target) {
              messageDisplay.textContent = "VICTORY! Target score achieved!";
              messageDisplay.classList.remove("hidden");
            } else {
              messageDisplay.textContent = `Time's up! Final score: ${score}.`;
              messageDisplay.classList.remove("hidden");
            }
          }
        }

        clickerBtn.onclick = () => {
          if (!gameRunning) return;
          score++;
          scoreDisplay.textContent = score;
          if (score === 1 && !timerInterval) {
            timerInterval = setInterval(updateTimer, 1000);
          }
        };
      }

      // --- 2. Quiz Game Logic (Dynamically configured) ---
      function renderQuiz(data) {
        let timeRemaining = data.timeLimit || 30;
        let gameRunning = true;
        let timerInterval;

        const html = `
                <div class="space-y-6">
                    <p class="text-2xl font-bold text-gray-700">${
                      data.question || "What is the primary color of the sky?"
                    }</p>
                    <p class="text-lg">Time Left: <span id="quizTimer" class="font-semibold text-red-500">${timeRemaining}s</span></p>
                    <input type="text" id="quizAnswer" placeholder="Type your answer here..." 
                           class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:ring-blue-500">
                    <button id="quizSubmitBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition duration-150 shadow-md">
                        Submit Answer
                    </button>
                    <p id="quizMessage" class="font-semibold mt-2"></p>
                </div>
            `;
        gameArea.innerHTML = html;

        const timerDisplay = document.getElementById("quizTimer");
        const answerInput = document.getElementById("quizAnswer");
        const submitBtn = document.getElementById("quizSubmitBtn");
        const messageDisplay = document.getElementById("quizMessage");

        function endGame(isCorrect) {
          clearInterval(timerInterval);
          gameRunning = false;
          answerInput.disabled = true;
          submitBtn.disabled = true;

          if (isCorrect) {
            messageDisplay.textContent = "Correct! You win!";
            messageDisplay.className = "text-green-600 font-semibold mt-2";
          } else {
            messageDisplay.textContent = `Incorrect or Time's up! The answer was: ${data.answer}`;
            messageDisplay.className = "text-red-600 font-semibold mt-2";
          }
        }

        function updateTimer() {
          timeRemaining--;
          timerDisplay.textContent = `${timeRemaining}s`;

          if (timeRemaining <= 0) {
            endGame(false);
          }
        }

        submitBtn.onclick = () => {
          if (!gameRunning) return;
          const submittedAnswer = answerInput.value.trim().toLowerCase();
          const correctAnswer = (data.answer || "blue").trim().toLowerCase();

          if (submittedAnswer === correctAnswer) {
            endGame(true);
          } else {
            messageDisplay.textContent = "Try again! That's not right.";
            messageDisplay.className = "text-orange-500 font-semibold mt-2";
          }
        };

        // Start the timer
        timerInterval = setInterval(updateTimer, 1000);
      }

      // --- 3. Memory Match Game Logic (Placeholder) ---
      function renderMemory(data) {
        const pairs = data.numPairs || 4;
        const cardIcons =
          data.cardIcons && data.cardIcons.length >= pairs
            ? data.cardIcons.slice(0, pairs)
            : ["A", "B", "C", "D"];

        const html = `
                <div class="space-y-4">
                    <p class="text-xl font-bold text-purple-600">Memory Match Game (Placeholder)</p>
                    <p class="text-base text-gray-700">Configured for ${pairs} pairs (${
          pairs * 2
        } cards).</p>
                    <p class="text-sm text-gray-500">Icons used: ${cardIcons.join(
                      ", "
                    )}</p>
                    <div class="grid grid-cols-4 gap-3 p-4 bg-purple-50 rounded-lg">
                        <div class="p-4 bg-purple-200 rounded-lg text-4xl cursor-pointer">?</div>
                        <div class="p-4 bg-purple-200 rounded-lg text-4xl cursor-pointer">?</div>
                        <div class="p-4 bg-purple-200 rounded-lg text-4xl cursor-pointer">?</div>
                        <div class="p-4 bg-purple-200 rounded-lg text-4xl cursor-pointer">?</div>
                        <div class="p-4 bg-purple-200 rounded-lg text-4xl cursor-pointer">?</div>
                        <div class="p-4 bg-purple-200 rounded-lg text-4xl cursor-pointer">?</div>
                        <div class="p-4 bg-purple-200 rounded-lg text-4xl cursor-pointer">?</div>
                        <div class="p-4 bg-purple-200 rounded-lg text-4xl cursor-pointer">?</div>
                    </div>
                </div>
            `;
        gameArea.innerHTML = html;
        statusMessage.textContent =
          "Memory Match loaded! (Full game logic implementation skipped for brevity, but the configuration data is ready to be used!)";
      }

      // Initialize on load
      document.addEventListener("DOMContentLoaded", initializeFirebase);
    </script>
  </body>
</html>
